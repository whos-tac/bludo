apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bludo-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - bludo.co
    secretName: bludo-tls
  rules:
    - host: bludo.co
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: bludo-svc
                port:
                  number: 80
