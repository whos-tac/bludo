{{- define "env" -}}
- name: SECRET_KEY_BASE
  valueFrom:
    secretKeyRef:
      name: bludo-secret
      key: secret-key-base
- name: POD_IP
  valueFrom:
    fieldRef:
      fieldPath: status.podIP
- name: NAMESPACE
  valueFrom:
    fieldRef:
      fieldPath: metadata.namespace
- name: ENDPOINT_HOST
  value: bludo.co
- name: DATABASE_URL
  value: postgresql://bludo:bludo@10.0.0.6:6432/bludo
- name: S3_ACCESS_KEY_ID
  value: XXX
- name: S3_BUCKET
  value: XXX
- name: POOL_SIZE
  value: "20"
- name: S3_REGION
  value: eu-west-3
- name: S3_SECRET_ACCESS_KEY
  value: XXX
- name: PRESENTATION_STORAGE
  value: s3
{{- end -}}
