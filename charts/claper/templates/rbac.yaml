apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-bludo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-bludo
rules:
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - list
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-bludo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: role-bludo
subjects:
  - kind: ServiceAccount
    name: sa-bludo