services:
  db:
    image: postgres:15
    ports:
      - 5432:5432
    volumes:
      - "bludo-db:/var/lib/postgresql/data"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - "-q"
        - "-d"
        - "bludo"
        - "-U"
        - "bludo"
      retries: 3
      timeout: 5s
    environment:
      POSTGRES_PASSWORD: bludo
      POSTGRES_USER: bludo
      POSTGRES_DB: bludo
    networks:
      - bludo-dev
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 4000:4000
    volumes:
      - ".:/app"
    env_file: .env
    depends_on:
      - db
    networks:
      - bludo-dev

volumes:
  bludo-db:
    driver: local

networks:
  bludo-dev:
    driver: bridge
